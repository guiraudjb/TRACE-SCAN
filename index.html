<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TRACE_SCAN - Inventaire Nomade</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="view-home" class="view">
        <header>
            <h1>TRACE_SCAN</h1>
            <div style="display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end;">
                <button class="btn btn-secondary btn-sm" id="btn-import-csv" title="Importer un projet depuis un CSV">📄 +CSV</button>
                <button class="btn btn-secondary btn-sm" id="btn-import-db" title="Restaurer une sauvegarde JSON">📥 Backup</button>
                <button class="btn btn-secondary btn-sm" id="btn-export-db" title="Créer une sauvegarde JSON">📤 Backup</button>
            </div>
        </header>
        <main>
            <button class="btn btn-primary" id="btn-new-project" style="width: 100%; margin-bottom: 1.5rem;">+ Nouvel Inventaire</button>
            <div id="project-list"></div>
            
            <input type="file" id="input-file-import" class="hidden" accept=".json">
            <input type="file" id="input-file-csv" class="hidden" accept=".csv">
        </main>
    </div>

    <div id="view-scan" class="view hidden">
        <header>
            <button class="btn btn-secondary btn-sm" id="btn-back">⬅ Retour</button>
            <h1 id="active-project-name">Scan</h1>
            <button class="btn btn-primary btn-sm" id="btn-export-csv">Exporter</button>
        </header>
        <main style="padding: 0;">
            <div id="reader"></div>
            <div style="padding: 1rem; display: flex; flex-direction: column; flex-grow: 1; overflow: hidden;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                <strong>Scans : <span id="scan-counter" style="color: var(--blue-france);">0</span></strong>
                <button class="btn btn-secondary btn-sm" id="btn-toggle-sort">Trier : A-Z</button>
            </div>
            <ul id="scanned-items"></ul>
    </div>
        </main>
    </div>

    <div id="toast">Message</div>

    <script src="html5-qrcode.min.js"></script>
    <script src="storage.js"></script>
    <script src="app.js"></script>
</body>
</html>
